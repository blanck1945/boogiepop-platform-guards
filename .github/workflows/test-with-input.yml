name: Test With Input And Permissions

on:
  workflow_call:
    inputs:
      owner_username:
        required: false
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print input
        env:
          OWNER: ${{ inputs.owner_username }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "owner=$OWNER event=$EVENT"
