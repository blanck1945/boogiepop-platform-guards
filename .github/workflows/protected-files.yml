name: Protected Files Guard

on:
  workflow_call:
    inputs:
      owner_username:
        required: false
        type: string
        default: ""

jobs:
  check-protected-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected files and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_OWNER_USERNAME: ${{ inputs.owner_username }}
        run: |
          set -e

          if [ -z "${PLATFORM_OWNER_USERNAME}" ]; then
            echo "ERROR: owner_username input is required but was not provided."
            exit 1
          fi

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "No es un PR — saltando check."
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)

          PROTECTED_FILES="AGENTS.md"
          PROTECTED_DIRS=".github/workflows"

          FAILED_FILES=""

          for file in $PROTECTED_FILES; do
            if echo "$CHANGED" | grep -qx "$file"; then
              echo "PROTEGIDO: '$file' fue modificado."
              FAILED_FILES="$FAILED_FILES $file"
            fi
          done

          for dir in $PROTECTED_DIRS; do
            if echo "$CHANGED" | grep -q "^${dir}/"; then
              echo "PROTEGIDO: archivos en '${dir}/' fueron modificados."
              FAILED_FILES="$FAILED_FILES ${dir}/"
            fi
          done

          if [ -z "$FAILED_FILES" ]; then
            echo "OK: ningún archivo protegido fue modificado."
            exit 0
          fi

          OWNER_APPROVED=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${PLATFORM_OWNER_USERNAME}\" and .state == \"APPROVED\")] | length")

          if [ "${OWNER_APPROVED}" -gt 0 ]; then
            echo "OK: Owner (${PLATFORM_OWNER_USERNAME}) aprobó el PR — guard pasa."
            exit 0
          fi

          echo ""
          echo "BLOQUEADO: los siguientes archivos protegidos fueron modificados:"
          for f in $FAILED_FILES; do echo "  - $f"; done
          echo ""
          echo "Para desbloquear:"
          echo "  1. Pedile al Owner que apruebe este PR (click 'Review changes → Approve' en GitHub)"
          echo "  2. Re-corré este workflow (o pusheá un commit vacío)"
          exit 1
