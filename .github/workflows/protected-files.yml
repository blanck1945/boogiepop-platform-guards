name: Protected Files Guard

on:
  workflow_call:
    inputs:
      owner_username:
        required: false
        type: string
        default: ""

jobs:
  check-protected-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected files and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_OWNER_USERNAME: ${{ inputs.owner_username }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          if [ -z "${PLATFORM_OWNER_USERNAME}" ]; then
            echo "ERROR: owner_username input is required."
            exit 1
          fi

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Not a PR - skipping check."
            exit 0
          fi

          git fetch origin "${BASE_SHA}" --depth=1 2>/dev/null || true
          CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null || true)

          PROTECTED_FILES="AGENTS.md"
          PROTECTED_DIRS=".github/workflows"

          FAILED_FILES=""

          for file in $PROTECTED_FILES; do
            if echo "$CHANGED" | grep -qx "$file"; then
              echo "PROTECTED: '$file' was modified."
              FAILED_FILES="$FAILED_FILES $file"
            fi
          done

          for dir in $PROTECTED_DIRS; do
            if echo "$CHANGED" | grep -q "^${dir}/"; then
              echo "PROTECTED: files in '${dir}/' were modified."
              FAILED_FILES="$FAILED_FILES ${dir}/"
            fi
          done

          if [ -z "$FAILED_FILES" ]; then
            echo "OK: no protected files were modified."
            exit 0
          fi

          OWNER_APPROVED=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${PLATFORM_OWNER_USERNAME}\" and .state == \"APPROVED\")] | length")

          if [ "${OWNER_APPROVED}" -gt 0 ]; then
            echo "OK: Owner (${PLATFORM_OWNER_USERNAME}) approved the PR - guard passes."
            exit 0
          fi

          echo ""
          echo "BLOCKED: the following protected files were modified:"
          for f in $FAILED_FILES; do echo "  - $f"; done
          echo ""
          echo "To unblock:"
          echo "  1. Ask the Owner to approve this PR (Review changes -> Approve on GitHub)"
          echo "  2. Re-run this workflow (or push an empty commit)"
          exit 1
