name: Protected Files Guard

on:
  workflow_call:
    inputs:
      owner_username:
        required: false
        type: string
        default: ""

jobs:
  check-protected-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected files and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_OWNER_USERNAME: ${{ inputs.owner_username }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          if [ -z "${PLATFORM_OWNER_USERNAME}" ]; then
            echo "ERROR: owner_username input is required."
            exit 1
          fi

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Not a PR - skipping check."
            exit 0
          fi

          git fetch origin "${BASE_SHA}" --depth=1 2>/dev/null || true

          PROTECTED_FILES="AGENTS.md"
          PROTECTED_DIRS=".github/workflows"

          # Net diff base→HEAD (catches normal changes)
          CHANGED_NET=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null || true)

          # Per-commit file list base..HEAD (catches add+revert in same PR)
          CHANGED_COMMITS=$(git log --name-only --pretty=format: "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null | grep -v '^$' || true)

          CHANGED=$(printf '%s\n%s\n' "$CHANGED_NET" "$CHANGED_COMMITS" | sort -u | grep -v '^$')

          FAILED_FILES=""

          for file in $PROTECTED_FILES; do
            if echo "$CHANGED" | grep -qx "$file"; then
              echo "PROTECTED: '$file' was modified."
              FAILED_FILES="$FAILED_FILES $file"
            fi
          done

          for dir in $PROTECTED_DIRS; do
            if echo "$CHANGED" | grep -q "^${dir}/"; then
              echo "PROTECTED: files in '${dir}/' were modified."
              FAILED_FILES="$FAILED_FILES ${dir}/"
            fi
          done

          if [ -z "$FAILED_FILES" ]; then
            echo "OK: no protected files were modified."
            exit 0
          fi

          # Find the most recent commit in this PR that touched a protected file
          LAST_PROTECTED_SHA=""
          for commit in $(git log --pretty=format:"%H" "${BASE_SHA}..${HEAD_SHA}"); do
            commit_files=$(git diff-tree --no-commit-id -r --name-only "$commit" 2>/dev/null || true)
            FOUND=false
            for f in $PROTECTED_FILES; do
              echo "$commit_files" | grep -qx "$f" && FOUND=true && break
            done
            for d in $PROTECTED_DIRS; do
              echo "$commit_files" | grep -q "^${d}/" && FOUND=true && break
            done
            if $FOUND; then
              LAST_PROTECTED_SHA="$commit"
              break
            fi
          done

          # Check Owner approval — must be on or after the last protected-file commit
          APPROVED_COMMIT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq "[.[] | select(.user.login == \"${PLATFORM_OWNER_USERNAME}\" and .state == \"APPROVED\")] | last | .commit_id // empty")

          OWNER_APPROVED=0
          if [ -n "$APPROVED_COMMIT" ] && [ -n "$LAST_PROTECTED_SHA" ]; then
            if git merge-base --is-ancestor "${LAST_PROTECTED_SHA}" "${APPROVED_COMMIT}" 2>/dev/null; then
              OWNER_APPROVED=1
            fi
          fi

          if [ "${OWNER_APPROVED}" -gt 0 ]; then
            echo "OK: Owner (${PLATFORM_OWNER_USERNAME}) approved after the last protected file change."
            exit 0
          fi

          echo ""
          echo "BLOCKED: the following protected files were modified:"
          for f in $FAILED_FILES; do echo "  - $f"; done
          echo ""
          echo "To unblock:"
          echo "  1. Ask the Owner to approve this PR (Review changes -> Approve on GitHub)"
          echo "  2. Re-run this workflow (or push an empty commit)"
          exit 1
