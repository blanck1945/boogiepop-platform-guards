# Guard: archivos protegidos de plataforma
#
# Incluir desde los seeds con:
#   include:
#     - project: '<namespace>/boogiepop-platform-guards'
#       file: '/guards/protected-files.yml'
#       ref: main
#
# Variables requeridas (nivel grupo o proyecto):
#   PLATFORM_API_TOKEN      — GitLab token con scope read_api
#   PLATFORM_OWNER_USERNAME — username del Owner que puede aprobar
#
# Flujo cuando se tocan archivos protegidos en una MR:
#   1. Guard falla con mensaje "requiere aprobación del Owner"
#   2. Owner abre la MR y hace click en Approve
#   3. Re-run del pipeline → guard llama la API → ve la aprobación → pasa

check-protected-files:
  stage: verify
  image: alpine:3.19
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  script:
    - |
      apk add --no-cache git curl > /dev/null 2>&1

      # Determinar base del diff
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ "${CI_COMMIT_BEFORE_SHA:-}" = "0000000000000000000000000000000000000000" ] || [ -z "${CI_COMMIT_BEFORE_SHA:-}" ]; then
        echo "Primer commit o SHA anterior desconocido — saltando check."
        exit 0
      else
        BASE_SHA="$CI_COMMIT_BEFORE_SHA"
      fi

      git fetch origin "$BASE_SHA" --depth=1 > /dev/null 2>&1 || true
      CHANGED=$(git diff --name-only "$BASE_SHA" "$CI_COMMIT_SHA" 2>/dev/null || true)

      # Archivos protegidos — modificar esta lista solo en este repo (platform-guards)
      PROTECTED="
      AGENTS.md
      .gitlab-ci.yml
      "

      FAILED_FILES=""
      for file in $PROTECTED; do
        [ -z "$file" ] && continue
        if echo "$CHANGED" | grep -qx "$file"; then
          echo "PROTEGIDO: '$file' fue modificado."
          FAILED_FILES="$FAILED_FILES $file"
        fi
      done

      if [ -z "$FAILED_FILES" ]; then
        echo "OK: ningún archivo protegido fue modificado."
        exit 0
      fi

      # Hay archivos protegidos modificados — verificar aprobación del Owner
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        # Contexto MR: consultar API de aprobaciones
        if [ -z "${PLATFORM_API_TOKEN:-}" ] || [ -z "${PLATFORM_OWNER_USERNAME:-}" ]; then
          echo ""
          echo "BLOQUEADO: archivos protegidos modificados pero PLATFORM_API_TOKEN"
          echo "o PLATFORM_OWNER_USERNAME no están configurados en CI/CD Variables."
          echo "Contactar al equipo de plataforma."
          exit 1
        fi

        APPROVALS=$(curl -sf \
          --header "PRIVATE-TOKEN: ${PLATFORM_API_TOKEN}" \
          "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/approvals" \
          2>/dev/null || echo '{}')

        if echo "$APPROVALS" | grep -q "\"username\":\"${PLATFORM_OWNER_USERNAME}\""; then
          echo "OK: Owner (${PLATFORM_OWNER_USERNAME}) aprobó la MR — guard pasa."
          exit 0
        fi

        echo ""
        echo "BLOQUEADO: los siguientes archivos protegidos fueron modificados:"
        for f in $FAILED_FILES; do echo "  - $f"; done
        echo ""
        echo "Para desbloquear:"
        echo "  1. Pedile al Owner que abra esta MR y haga click en 'Approve'"
        echo "  2. Re-corré este pipeline"
        exit 1
      else
        # Push directo (no MR) — bloquear siempre
        echo ""
        echo "BLOQUEADO: archivos protegidos modificados en push directo:"
        for f in $FAILED_FILES; do echo "  - $f"; done
        echo ""
        echo "Estos archivos solo pueden modificarse via MR con aprobación del Owner."
        exit 1
      fi
